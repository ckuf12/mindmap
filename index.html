<!doctype html><html lang=ja><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name=theme-color content="#17243a"><link rel=manifest href="manifest.json"><link rel=apple-touch-icon href="icon.png"><title>思考地図</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#f4f6fa;color:#17243a}header{background:#17243a;color:white;padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}header strong{font-size:20px}button,input,textarea,select{font:inherit;border:1px solid #c5cedb;border-radius:8px;padding:9px;background:white;color:#17243a}button{cursor:pointer}button:disabled{opacity:.4}#tools{display:flex;gap:6px;flex-wrap:wrap;padding:8px}#wrap{height:56dvh;min-height:260px;overflow:hidden;background:radial-gradient(#bec9db 1px,transparent 1px);background-size:20px 20px;border-block:1px solid #c5cedb}svg{width:100%;height:100%;touch-action:none;display:block}#editor{padding:10px;display:grid;gap:7px}#editor textarea{width:100%;min-height:70px}#editor input{width:100%}#status{font-size:12px}details{padding:10px}#sync{display:grid;gap:7px}#sync input{width:100%}body{padding-bottom:env(safe-area-inset-bottom)} </style><header><strong>思考地図</strong><select id=maps></select><button id=newmap>新規</button><span id=status>起動中</span></header><div id=tools><button id=add>＋ 子</button><button id=sibling>＋ 同階層</button><button id=del>削除</button><button id=fold>開閉</button><button id=undo>↶</button><button id=redo>↷</button><button id=fit>全体</button><button id=plus>＋</button><button id=minus>−</button><button id=link>接続</button><button id=unlink>接続解除</button><button id=export>保存ファイル</button><button id=import>読込</button><input id=file type=file accept=".json" hidden></div><div id=wrap><svg id=svg></svg></div><div id=editor><input id=name placeholder="ノード名"><textarea id=note placeholder="メモ（自動保存）"></textarea><input id=search placeholder="ノード検索（Enterで移動）"><span id=info></span></div><details><summary>端末間同期の設定（任意）</summary><div id=sync><p>Supabase のプロジェクトURL・公開キー・匿名ログインを利用します。両端末で同じメールアドレスとパスワードを使用してください。設定方法は同梱の README を参照。</p><input id=url placeholder="https://xxxx.supabase.co"><input id=key placeholder="公開 anon / publishable key"><input id=email type=email placeholder="メールアドレス"><input id=pass type=password placeholder="パスワード"><div><button id=signup>登録</button> <button id=login>ログイン</button> <button id=push>クラウドへ送信</button> <button id=pull>クラウドから取得</button></div><span id=cloud></span></div></details>
<script>
const $=x=>document.getElementById(x),svg=$('svg'),NS='http://www.w3.org/2000/svg',uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2),colors=['#6755a5','#287ca5','#bc5682','#ab782a','#168778','#61853f','#a76243','#596b86'];
const topics=[['文学・哲学','存在と認識|一元論・二元論|時間と反復|表象と批評|美と崇高|言語と主体'],['SF・世界観','宇宙的時間|集合意識|異質な知性|世界の外部'],['小説創作','名和ゆとり|ヒロインと選択|世界の崩壊と帰還|自由の逆説|形式の変容'],['映画・アニメ・音楽','映画批評|青春とセカイ系|美少女ゲーム|音楽と美学|評価の体系化'],['市場・投資','日経平均・CFD|テクニカル分析|PER・EPS|AIバブル|市場心理と戦略'],['技術・自動化','自作アプリ|知識管理|PC最適化|AI活用|音楽再生環境'],['身体・知覚','聴覚と音響|視覚と色彩|生活と身体'],['思考そのもの','思考とは何か|構造の発見|知識と創造性|観測者の立場']];
function seed(){let nodes=[{id:'root',p:null,t:'世界をどう認識するか',d:'関心領域の仮説的な中心',x:0,y:0,c:'#34456b'}];topics.forEach(([t,list],i)=>{let a=i*Math.PI/4-Math.PI/2,id=uid();nodes.push({id,p:'root',t,d:'',x:470*Math.cos(a),y:470*Math.sin(a),c:colors[i]});let ls=list.split('|');ls.forEach((t,j)=>{let b=a+(j-(ls.length-1)/2)*.15;nodes.push({id:uid(),p:id,t,d:'',x:1050*Math.cos(b),y:1050*Math.sin(b),c:colors[i]})})});let pairs=[['時間と反復','宇宙的時間'],['存在と認識','視覚と色彩'],['世界の外部','世界の崩壊と帰還'],['表象と批評','映画批評'],['構造の発見','テクニカル分析'],['AI活用','AIバブル'],['知識管理','知識と創造性'],['観測者の立場','名和ゆとり']];return {id:uid(),title:'関心領域',nodes,links:pairs.map(p=>p.map(t=>nodes.find(n=>n.t===t).id)),fold:[]}}
let state;try{state=JSON.parse(localStorage.getItem('mindmap-v1'))}catch{}if(!state?.maps?.length){let m=seed();state={maps:[m],active:m.id,updated:0}}let sel='root',z=.3,px=0,py=0,history=[],future=[],connecting=null,unlinking=false;const map=()=>state.maps.find(m=>m.id===state.active),get=id=>map().nodes.find(n=>n.id===id),cur=()=>get(sel)||map().nodes[0];
function persist(){state.updated=Date.now();try{localStorage.setItem('mindmap-v1',JSON.stringify(state));$('status').textContent='端末保存済 '+new Date().toLocaleTimeString()}catch(e){$('status').textContent='保存失敗！ファイルに保存してください'}}function snapshot(){history.push(JSON.stringify(state));if(history.length>80)history.shift();future=[]}function change(fn){snapshot();fn();persist();refresh()}
function el(t,a,p){let e=document.createElementNS(NS,t);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));p.appendChild(e);return e}const width=n=>Math.max(115,[...n.t].length*17+30);function visible(n){let p=n.p;while(p!==null){if(map().fold.includes(p))return false;p=get(p)?.p??null}return true}
function draw(){svg.replaceChildren();let g=el('g',{transform:`translate(${svg.clientWidth/2+px} ${svg.clientHeight/2+py}) scale(${z})`},svg);let v=map().nodes.filter(visible);function edge(a,b,dash){if(!a||!b||!visible(a)||!visible(b))return;el('path',{d:`M${a.x},${a.y} C${(a.x+b.x)/2},${a.y} ${(a.x+b.x)/2},${b.y} ${b.x},${b.y}`,fill:'none',stroke:dash?'#79869d':b.c,'stroke-width':dash?3:4,'stroke-dasharray':dash?'10 9':'none',opacity:.7},g)}v.forEach(n=>edge(get(n.p),n,false));map().links.forEach(([a,b])=>edge(get(a),get(b),true));v.forEach(n=>{let b=el('g',{transform:`translate(${n.x} ${n.y})`,'data-id':n.id,style:'cursor:grab'},g),w=width(n);el('rect',{x:-w/2,y:-24,width:w,height:48,rx:10,fill:n.c,stroke:n.id===sel?'#efb900':n.c,'stroke-width':n.id===sel?5:1},b);el('text',{x:0,y:6,'text-anchor':'middle',fill:'white','font-size':17,'pointer-events':'none'},b).textContent=n.t+(map().fold.includes(n.id)?' ＋':'')})}
function refresh(){if(!get(sel))sel=map().nodes[0].id;$('name').value=cur().t;$('note').value=cur().d||'';$('info').textContent=map().nodes.length+' ノード｜選択: '+cur().t;$('maps').replaceChildren(...state.maps.map(m=>new Option(m.title,m.id,m.id===state.active,m.id===state.active)));draw()}
function fit(){let v=map().nodes.filter(visible),l=Math.min(...v.map(n=>n.x-width(n)/2)),r=Math.max(...v.map(n=>n.x+width(n)/2)),t=Math.min(...v.map(n=>n.y-30)),b=Math.max(...v.map(n=>n.y+30));z=Math.min(1.5,(svg.clientWidth-24)/(r-l+24),(svg.clientHeight-24)/(b-t+24));px=-(l+r)/2*z;py=-(t+b)/2*z;draw()}
$('name').onchange=()=>{let t=$('name').value.trim();if(t)change(()=>{cur().t=t;if(cur().p===null)map().title=t})};$('name').oninput=()=>{let t=$('name').value.trim();if(t){cur().t=t;if(cur().p===null)map().title=t;persist();draw()}};$('note').oninput=()=>{cur().d=$('note').value;persist()};['name','note'].forEach(id=>$(id).onfocus=snapshot);
function add(p){change(()=>{let n={id:uid(),p:p.id,t:'新しい項目',d:'',x:p.x+(p.x<0?-1:1)*(width(p)/2+150),y:p.y+65*(map().nodes.filter(n=>n.p===p.id).length+1),c:p.c};map().nodes.push(n);map().fold=map().fold.filter(i=>i!==p.id);sel=n.id});$('name').focus();$('name').select()}
$('add').onclick=()=>add(cur());$('sibling').onclick=()=>{if(cur().p!==null)add(get(cur().p))};$('del').onclick=()=>{if(cur().p===null)return;if(!confirm('選択した枝を削除しますか？'))return;change(()=>{let ids=new Set([sel]),p=cur().p;for(let i=0;i<map().nodes.length;i++)map().nodes.forEach(n=>{if(ids.has(n.p))ids.add(n.id)});map().nodes=map().nodes.filter(n=>!ids.has(n.id));map().links=map().links.filter(a=>!a.some(i=>ids.has(i)));sel=p})};$('fold').onclick=()=>change(()=>{let f=map().fold;map().fold=f.includes(sel)?f.filter(i=>i!==sel):[...f,sel]});$('undo').onclick=()=>{if(history.length){future.push(JSON.stringify(state));state=JSON.parse(history.pop());persist();refresh()}};$('redo').onclick=()=>{if(future.length){history.push(JSON.stringify(state));state=JSON.parse(future.pop());persist();refresh()}};$('fit').onclick=fit;$('plus').onclick=()=>{z=Math.min(4,z*1.3);draw()};$('minus').onclick=()=>{z=Math.max(.03,z/1.3);draw()};$('link').onclick=()=>{connecting=sel;unlinking=false;$('info').textContent='接続先をタップ'};$('unlink').onclick=()=>{connecting=sel;unlinking=true;$('info').textContent='接続を解除する相手をタップ'};
let pointers=new Map(),drag=null,pinch=null;svg.onpointerdown=e=>{e.preventDefault();svg.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){let [a,b]=[...pointers.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z,px,py,x:(a.x+b.x)/2,y:(a.y+b.y)/2};drag=null;return}let id=e.target.closest('[data-id]')?.dataset.id;if(id){if(connecting!==null){let a=connecting;connecting=null;if(a!==id)change(()=>{let same=l=>l.includes(a)&&l.includes(id);if(unlinking)map().links=map().links.filter(l=>!same(l));else if(!map().links.some(same))map().links.push([a,id])});return}sel=id;refresh();let n=get(id);drag={id,x:n.x,y:n.y,sx:e.clientX,sy:e.clientY,m:false}}else drag={id:null,x:px,y:py,sx:e.clientX,sy:e.clientY,m:false}};
svg.onpointermove=e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pinch&&pointers.size===2){let [a,b]=[...pointers.values()],r=svg.getBoundingClientRect(),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;z=Math.max(.03,Math.min(4,pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/Math.max(1,pinch.d)));px=cx-r.left-r.width/2-(pinch.x-r.left-r.width/2-pinch.px)*z/pinch.z;py=cy-r.top-r.height/2-(pinch.y-r.top-r.height/2-pinch.py)*z/pinch.z;draw();return}if(!drag)return;let dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(!drag.m&&Math.hypot(dx,dy)<4)return;if(!drag.m&&drag.id)snapshot();drag.m=true;if(drag.id){let n=get(drag.id);n.x=drag.x+dx/z;n.y=drag.y+dy/z;persist()}else{px=drag.x+dx;py=drag.y+dy}draw()};function up(e){pointers.delete(e.pointerId);drag=null;pinch=null}svg.onpointerup=svg.onpointercancel=up;svg.addEventListener('wheel',e=>{e.preventDefault();let old=z,r=svg.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;z=Math.max(.03,Math.min(4,z*Math.exp(-e.deltaY*.001)));px=x-(x-px)*z/old;py=y-(y-py)*z/old;draw()},{passive:false});
$('maps').onchange=()=>{state.active=$('maps').value;sel=map().nodes[0].id;persist();refresh();fit()};$('newmap').onclick=()=>{let t=prompt('地図の名前','新しい地図');if(!t)return;change(()=>{let m={id:uid(),title:t,nodes:[{id:'root',p:null,t,d:'',x:0,y:0,c:colors[0]}],links:[],fold:[]};state.maps.push(m);state.active=m.id;sel='root'});fit()};$('search').onkeydown=e=>{if(e.key==='Enter'){let n=map().nodes.find(n=>n.t.includes($('search').value)||n.d?.includes($('search').value));if(n){map().fold=[];sel=n.id;z=1;px=-n.x;py=-n.y;refresh()}}};
function validate(s){return s&&Array.isArray(s.maps)&&s.maps.length&&s.maps.some(m=>m.id===s.active)&&s.maps.every(m=>Array.isArray(m.nodes)&&m.nodes.length&&Array.isArray(m.links)&&Array.isArray(m.fold)&&m.nodes.every(n=>typeof n.t==='string'&&Number.isFinite(n.x)&&Number.isFinite(n.y)))}$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='mindmap-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)};$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{let d=JSON.parse(await $('file').files[0].text());if(!validate(d)){if(!Array.isArray(d.nodes))throw Error();let m={id:uid(),title:d.nodes[0].t,nodes:d.nodes.map(n=>({...n,c:typeof n.c==='string'?n.c:colors[(n.c||0)%8],d:n.d||''})),fold:[],links:[]};if(d.crossNames)m.links=d.crossNames.map(p=>p.map(t=>m.nodes.find(n=>n.t===t)?.id)).filter(p=>p.every(x=>x!==undefined));change(()=>{state.maps.push(m);state.active=m.id;sel=m.nodes[0].id})}else if(confirm('現在の全地図をバックアップの内容で置き換えますか？'))change(()=>{state=d;sel=map().nodes[0].id});fit()}catch{alert('読込失敗')} $('file').value=''};
let cfg={};try{cfg=JSON.parse(localStorage.getItem('mindmap-sync')||'{}')}catch{}['url','key','email'].forEach(k=>$(k).value=cfg[k]||'');let session=null;function config(){cfg={url:$('url').value.trim().replace(/\/$/,''),key:$('key').value.trim(),email:$('email').value.trim()};if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(cfg.url)||!cfg.key)throw Error('URLと公開キーを確認');localStorage.setItem('mindmap-sync',JSON.stringify(cfg));return cfg}async function api(path,method='GET',body,auth=false){let r=await fetch(cfg.url+path,{method,headers:{apikey:cfg.key,'Content-Type':'application/json',...(auth?{Authorization:'Bearer '+session.access_token,Prefer:'resolution=merge-duplicates,return=representation'}:{})},...(body?{body:JSON.stringify(body)}:{})});let t=await r.text(),d=t?JSON.parse(t):null;if(!r.ok)throw Error(d?.msg||d?.message||d?.error_description||'通信エラー');return d}function cloud(fn){return async()=>{try{config();await fn()}catch(e){$('cloud').textContent=e.message}}}async function login(){session=await api('/auth/v1/token?grant_type=password','POST',{email:cfg.email,password:$('pass').value});$('cloud').textContent='ログイン済み';$('pass').value=''}$('signup').onclick=cloud(async()=>{await api('/auth/v1/signup','POST',{email:cfg.email,password:$('pass').value});$('cloud').textContent='登録完了。確認メールが必要な場合は確認後ログイン'});$('login').onclick=cloud(login);function requireSession(){if(!session?.access_token)throw Error('先にログインしてください')} $('push').onclick=cloud(async()=>{requireSession();let rows=await api('/rest/v1/mindmaps?select=updated_at&user_id=eq.'+session.user.id,'GET',null,true);if(rows.length&&!confirm('クラウドのデータをこの端末の内容で上書きしますか？'))return;await api('/rest/v1/mindmaps?on_conflict=user_id','POST',{user_id:session.user.id,data:state,updated_at:new Date().toISOString()},true);$('cloud').textContent='送信完了'});$('pull').onclick=cloud(async()=>{requireSession();let rows=await api('/rest/v1/mindmaps?select=data,updated_at&user_id=eq.'+session.user.id,'GET',null,true);if(!rows.length)throw Error('クラウドにデータがありません');if(!validate(rows[0].data))throw Error('データ形式不正');if(!confirm('端末のデータをクラウド版で置き換えますか？ 先に保存ファイルでバックアップできます。'))return;change(()=>{state=rows[0].data;sel=map().nodes[0].id});fit();$('cloud').textContent='取得完了'});
refresh();persist();fit();new ResizeObserver(draw).observe(svg);if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></html>
