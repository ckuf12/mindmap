function accept(r){base=r?{rev:r.updated_at,data:content(r.data)}:null;dirty=!!r&&content(state)!==base.data;storeSession()}
function apply(r){if(!r)throw Error('クラウドにデータがありません');localStorage.setItem('mindmap-before-cloud-v2',JSON.stringify(state));snapshot();let active=state.active;state=r.data;if(state.maps.some(m=>m.id===active))state.active=active;saveLocal();accept(r);blocked=false;dirty=false;storeSession();refresh();fit();msg('同期済み '+new Date().toLocaleTimeString())}
async function send(r){let data=JSON.parse(JSON.stringify(state));let stamp=new Date().toISOString();let rows;if(r){rows=await req(path()+'&updated_at=eq.'+encodeURIComponent(r.updated_at),'PATCH',{data,updated_at:stamp},true)}else{rows=await req('/rest/v1/mindmaps','POST',{user_id:session.user.id,data,updated_at:stamp},true)}if(!rows?.length){blocked=true;storeSession();throw Error('別端末で更新されました。自動同期を停止しました')}accept(rows[0]);dirty=content(state)!==base.data;blocked=false;storeSession();msg('同期済み '+new Date().toLocaleTimeString());if(dirty)scheduleSync()}
function scheduleSync(){if(!session)return;dirty=base?content(state)!==base.data:true;storeSession();if(!$('auto').checked||blocked)return;clearTimeout(timer);timer=setTimeout(sync,1500);msg('変更を保存中…')}
function editing(){return pointers.size>0||composing}
function receivingUnsafe(){return editing()||['name','note'].includes(document.activeElement?.id)}
async function sync(){if(!session||!$('auto').checked||busy||blocked||editing()||document.hidden||Date.now()-lastInput<1400)return;busy=true;try{let r=await remote();if(!session||!$('auto').checked)return;if(editing()||Date.now()-lastInput<1400)return;let localChanged=base?content(state)!==base.data:dirty;let remoteChanged=base?r?.updated_at!==base.rev:!!r;if(r&&content(r.data)===content(state)){accept(r);msg('同期済み');return}if(localChanged&&remoteChanged){blocked=true;storeSession();msg('競合：自動同期停止。両端末をバックアップし、送信か取得を選択してください');return}if(localChanged){await send(r)}else if(remoteChanged&&r){if(receivingUnsafe()){msg('他端末の更新あり：入力欄を離れると反映');return}apply(r)}else if(!r&&!base){await send(null)}else{msg('同期済み')}}catch(e){msg('同期未完了：'+e.message)}finally{busy=false}}
function run(fn){return async()=>{if(busy)return;busy=true;try{config();await fn()}catch(e){msg(e.message)}finally{busy=false}}}
$('signup').onclick=run(async()=>{await req('/auth/v1/signup','POST',{email:cfg.email,password:$('pass').value});msg('登録完了。確認メールの後ログイン')});
$('login').onclick=run(async()=>{session=await req('/auth/v1/token?grant_type=password','POST',{email:cfg.email,password:$('pass').value});$('pass').value='';passField.blur();base=null;blocked=false;dirty=false;let r=await remote();if(r&&content(r.data)!==content(state)){blocked=true;msg('ログイン済み：初回は送信か取得を選択してください')}else{accept(r);msg('ログイン済み')}storeSession()});
$('push').onclick=run(async()=>{let r=await remote();if(r&&!confirm('クラウドをこの端末の内容で上書きしますか？'))return;await send(r)});
$('pull').onclick=run(async()=>{let r=await remote();if(!r)throw Error('クラウドにデータがありません');if(confirm('端末の内容をクラウド版で置き換えますか？ 先に保存ファイルでバックアップしてください。'))apply(r)});
$('auto').onchange=()=>{if(!session){$('auto').checked=false;msg('先にログインしてください');return}storeSession();if($('auto').checked){if(blocked)msg('初回設定または競合：送信か取得を選択してください');else sync()}else msg('自動同期OFF')};
$('logout').onclick=()=>{if(busy)return;session=null;base=null;dirty=false;blocked=false;$('auto').checked=false;localStorage.removeItem('mindmap-session-v2');msg('ログアウト済み')};
try{let saved=JSON.parse(localStorage.getItem('mindmap-session-v2')||'null');if(saved&&saved.url===cfg.url&&saved.key===cfg.key&&saved.email===cfg.email){session=saved.session;base=saved.base;dirty=saved.dirty;blocked=saved.blocked;$('auto').checked=!!saved.auto;msg(blocked?'同期停止：送信か取得を選択':'ログイン情報復元済み')}}catch{}
setInterval(sync,5000);window.addEventListener('online',sync);window.addEventListener('focus',sync);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});['name','note'].forEach(id=>$(id).addEventListener('blur',()=>setTimeout(sync,100)));setTimeout(sync,1000);
refresh();saveLocal();fit();new ResizeObserver(draw).observe(svg);
let swRegistration=null;if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{swRegistration=r}).catch(()=>{});
$('update').onclick=async()=>{const b=$('update');b.disabled=true;b.textContent='確認中…';try{saveLocal();if(swRegistration){await swRegistration.update();let w=swRegistration.installing||swRegistration.waiting;if(w&&w.state!=='activated'&&w.state!=='redundant')await new Promise(resolve=>{let done=()=>{if(['activated','redundant'].includes(w.state))resolve()};w.addEventListener('statechange',done);done();setTimeout(resolve,5000)})}const u=new URL(location.href);u.searchParams.set('_update',Date.now());location.replace(u.href)}catch(e){b.disabled=false;b.textContent='更新';msg('更新確認失敗：'+e.message)}};
</script></html>
